name: Check and publish status

on:
  schedule:
    # Backup only: GitHub runs schedules when it has capacity and often
    # delays or skips them, worst on the busy minutes (:00, :15, ...), so
    # these are off-peak. For reliable runs, start the workflow from outside
    # (see "Fresher updates" in the README).
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
  # Publish incidents, maintenance and news as soon as an issue changes.
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: write   # push collected data to the `data` branch
  issues: write     # read issues; create the incident/maintenance/news labels
  pages: write
  id-token: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The issue forms apply these labels; make sure they exist.
      - name: Create status labels
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          gh label create incident    --force --color d73a4a --description "Published on the status page as an incident"
          gh label create maintenance --force --color 134f7d --description "Published on the status page as maintenance"
          gh label create news        --force --color 00c1c1 --description "Published on the status page as news"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Collected data lives on its own branch so main only holds code and
      # the history of check results doesn't clutter it. The branch is
      # replaced with a single commit each run; the JSON files carry the
      # history themselves (7 days raw, 90 days daily).
      - name: Restore data from the data branch
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C data
          fi

      - name: Collect service status, news and issues
        run: node scripts/collect.mjs --data data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # One "name=key" line per UptimeRobot monitor-specific API key.
          UPTIMEROBOT_MONITOR_KEYS: ${{ secrets.UPTIMEROBOT_MONITOR_KEYS }}

      - name: Save data to the data branch
        run: |
          cd data
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Status data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Until a real metrics source exists, use the sample usage numbers.
      - name: Use sample metrics if none were collected
        run: '[ -f data/metrics.json ] || cp sample-data/metrics.json data/metrics.json'

      - name: Build site
        run: node scripts/build.mjs --data data --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
